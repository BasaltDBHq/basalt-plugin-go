name: PR title

# A pull request title reads `type(scope): message` or `type: message`.
# The message starts with a lowercase letter and has no trailing period.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|chore|docs|refactor|perf|test|ci|build|style|revert)(\([a-z0-9][a-z0-9._/,-]*\))?!?: [a-z].*[^. ]$|^(feat|fix|chore|docs|refactor|perf|test|ci|build|style|revert)(\([a-z0-9][a-z0-9._/,-]*\))?!?: [a-z]$'
          if printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo "Title ok: $TITLE"
            exit 0
          fi
          echo "::error::PR title does not match 'type(scope): message' or 'type: message'."
          echo "Types: feat fix chore docs refactor perf test ci build style revert."
          echo "The message starts with a lowercase letter and has no trailing period."
          echo "Got: $TITLE"
          exit 1
